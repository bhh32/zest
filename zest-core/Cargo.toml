[package]
name = "zest-core"
description = "Application contract and async runtime for the zest GUI framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
embedded-graphics.workspace = true
embedded-graphics-core.workspace = true
zest-theme.workspace = true

# Embassy: the async runtime zest is built on. Every Platform
# implementation uses these (embassy-time for delays, embassy-sync for
# channels, embassy-futures::select3 for the runtime's three-way
# select between events/tasks/subscriptions).
embassy-time = { version = "0.4", default-features = false }
embassy-sync = { version = "0.7", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

[lints]
workspace = true
