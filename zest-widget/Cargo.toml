[package]
name = "zest-widget"
description = "Standard widget library for the zest GUI framework."
documentation = "https://docs.rs/zest-widget"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
embedded-graphics.workspace = true
embedded-graphics-core.workspace = true
qrcodegen-no-heap = "1.8.1"
zest-core.workspace = true
zest-theme.workspace = true

[dev-dependencies]
# Examples use the framework's default desktop platform (simulator) and
# embassy's std executor. Enabling the simulator feature on zest pulls
# in SDL2 only for example builds; library users on embedded targets
# aren't affected. The `net` feature pulls in zest's HTTP shim so the
# weather demo doesn't need to depend on reqwest directly.
zest = { package = "zest-gui", path = "../zest", version = "^0.1", features = ["simulator", "net"] }
embassy-executor = { version = "0.7", features = ["arch-std", "executor-thread"] }
embassy-time = { version = "0.4", features = ["std", "generic-queue-8"] }
rand = { version = "0.10.1", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
chrono = "0.4.44"

[lints]
workspace = true

