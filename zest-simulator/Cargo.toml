[package]
name = "zest-simulator"
description = "Desktop simulator Platform for the zest GUI framework via embedded-graphics-simulator + SDL2."
documentation = "https://docs.rs/zest-simulator"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
embedded-graphics.workspace = true
embedded-graphics-simulator = "0.8"
tiny-skia = "0.11"
zest-core.workspace = true

# Embassy on desktop: arch-std executor + std-backed time-queue.
embassy-time = { version = "0.4", features = ["std", "generic-queue-8"] }
embassy-executor = { version = "0.7", features = ["arch-std", "executor-thread"] }

[lints]
workspace = true
